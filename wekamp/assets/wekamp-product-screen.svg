<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1440" role="img" aria-labelledby="title desc">
  <title id="title">WeKamp mobile app preview</title>
  <desc id="desc">A mobile-first WeKamp product screen showing a community feed, trust metrics, assistant guidance, and bottom navigation on a phone frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fcfaf6"/>
      <stop offset="100%" stop-color="#eef5ee"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbfcfa"/>
    </linearGradient>
    <linearGradient id="greenFade" x1="0" x2="1">
      <stop offset="0%" stop-color="#2f7d4b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2f7d4b" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#16281f" flood-opacity="0.18"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16281f" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16281f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="900" height="1440" rx="44" fill="url(#bg)"/>
  <circle cx="140" cy="120" r="120" fill="#dcefe1" opacity="0.45"/>
  <circle cx="760" cy="110" r="130" fill="#dcefe1" opacity="0.45"/>
  <circle cx="160" cy="1300" r="180" fill="#dcefe1" opacity="0.30"/>

  <g filter="url(#shadow)">
    <rect x="196" y="76" width="508" height="1288" rx="64" fill="#111111"/>
  </g>

  <g>
    <rect x="222" y="112" width="456" height="1216" rx="48" fill="url(#screen)"/>
    <rect x="350" y="130" width="200" height="26" rx="13" fill="#0b0b0b"/>
    <text x="262" y="164" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f221a">9:41</text>

    <g transform="translate(444 130)">
      <circle cx="0" cy="0" r="12" fill="#0b0b0b"/>
      <circle cx="0" cy="0" r="5.2" fill="#1f1f1f"/>
    </g>

    <text x="396" y="218" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="700" fill="#204b38">WeKamp</text>
    <text x="396" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5c6b63">Community feed for cohorts and groups</text>

    <g filter="url(#softShadow)">
      <rect x="246" y="284" width="300" height="102" rx="26" fill="#eef6f0" stroke="#d9e5dd"/>
      <circle cx="282" cy="335" r="24" fill="#dcefe1"/>
      <path d="M271 344 L282 322 L293 344 Z" fill="#204b38"/>
      <rect x="336" y="310" width="126" height="14" rx="7" fill="#dce8df"/>
      <rect x="336" y="334" width="160" height="12" rx="6" fill="#e7efea"/>
      <text x="336" y="362" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#2d3c35">New members joined</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="246" y="408" width="300" height="170" rx="28" fill="#ffffff" stroke="#d9e5dd"/>
      <circle cx="282" cy="450" r="18" fill="#dcefe1"/>
      <text x="314" y="448" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#2d3c35">Kamp Explorer</text>
      <text x="314" y="470" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6d7f76">Outdoor guides · 2h</text>
      <text x="282" y="510" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5c54">What trail taught me about showing up for a community.</text>
      <rect x="282" y="530" width="206" height="40" rx="14" fill="#f1f6f2"/>
      <rect x="282" y="530" width="92" height="40" rx="14" fill="#b5dec1"/>
      <rect x="282" y="586" width="206" height="10" rx="5" fill="#e8efe9"/>
      <rect x="282" y="586" width="144" height="10" rx="5" fill="#2f7d4b"/>
    </g>

    <g filter="url(#softShadow)">
      <rect x="246" y="604" width="142" height="196" rx="26" fill="#ffffff" stroke="#d9e5dd"/>
      <text x="270" y="640" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2d3c35">Your setup</text>
      <rect x="270" y="656" width="96" height="10" rx="5" fill="#e2ebe5"/>
      <rect x="270" y="656" width="68" height="10" rx="5" fill="#2f7d4b"/>
      <text x="270" y="680" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6d7f76">0 of 7 completed</text>
      <g fill="#dcefe1">
        <circle cx="274" cy="716" r="12"/>
        <circle cx="274" cy="752" r="12"/>
        <circle cx="274" cy="788" r="12"/>
      </g>
      <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#4b5c54">
        <text x="296" y="720">Meet Ampy</text>
        <text x="296" y="756">Pick interests</text>
        <text x="296" y="792">Follow people</text>
      </g>
    </g>

    <g filter="url(#softShadow)">
      <rect x="404" y="604" width="142" height="196" rx="26" fill="#eef6f0" stroke="#d9e5dd"/>
      <circle cx="475" cy="654" r="31" fill="#dcefe1"/>
      <path d="M464 664 L475 640 L486 664 Z" fill="#204b38"/>
      <text x="475" y="708" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#2d3c35">Ampy helps</text>
      <text x="475" y="732" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5c6b63">Keep setup inside the app.</text>
      <rect x="432" y="752" width="86" height="28" rx="14" fill="#2f7d4b"/>
      <text x="475" y="771" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Start</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="246" y="822" width="300" height="128" rx="26" fill="#ffffff" stroke="#d9e5dd"/>
      <text x="270" y="860" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#2d3c35">Trust index</text>
      <text x="270" y="892" font-family="Fraunces, Georgia, serif" font-size="56" font-weight="700" fill="#204b38">74%</text>
      <text x="340" y="892" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f7d4b">verified, active, moderated</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="246" y="972" width="300" height="134" rx="26" fill="#ffffff" stroke="#d9e5dd"/>
      <text x="270" y="1008" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#2d3c35">Upcoming</text>
      <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5c54">
        <circle cx="274" cy="1038" r="8" fill="#dcefe1"/>
        <text x="292" y="1042">Kickoff reminder at 10:00</text>
        <circle cx="274" cy="1066" r="8" fill="#dcefe1"/>
        <text x="292" y="1070">Review two pending posts</text>
        <circle cx="274" cy="1094" r="8" fill="#dcefe1"/>
        <text x="292" y="1098">Publish welcome note</text>
      </g>
    </g>

    <g>
      <rect x="236" y="1218" width="320" height="72" rx="24" fill="#e8eee9" filter="url(#innerShadow)"/>
      <circle cx="280" cy="1254" r="12" fill="#204b38"/>
      <circle cx="352" cy="1254" r="12" fill="#2f7d4b"/>
      <rect x="424" y="1242" width="24" height="24" rx="6" fill="#204b38"/>
      <circle cx="496" cy="1254" r="12" fill="#2f7d4b"/>
      <circle cx="568" cy="1254" r="12" fill="#204b38"/>
    </g>

    <g>
      <rect x="286" y="186" width="220" height="28" rx="14" fill="url(#greenFade)"/>
    </g>
  </g>
</svg>
