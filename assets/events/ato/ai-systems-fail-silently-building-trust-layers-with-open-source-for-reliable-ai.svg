<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">All Things Open 2026 session poster</title>
  <desc id="desc">Gradient poster for AI Systems Fail Silently — Building Trust Layers with Open Source for Reliable AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06162b" />
      <stop offset="55%" stop-color="#12385f" />
      <stop offset="100%" stop-color="#0a1c35" />
    </linearGradient>
    <radialGradient id="glow" cx="36%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#79f0ff" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b84c6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)" />
  <rect width="1200" height="900" fill="url(#glow)" />
  <g opacity="0.18" fill="none" stroke="#d9f7ff" stroke-width="2">
