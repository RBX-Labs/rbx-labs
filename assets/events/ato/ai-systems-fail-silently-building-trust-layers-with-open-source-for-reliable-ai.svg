<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">All Things Open 2026 session poster</title>
  <desc id="desc">Poster for AI Systems Fail Silently - Building Trust Layers with Open Source for Reliable AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071324" />
      <stop offset="55%" stop-color="#122f56" />
      <stop offset="100%" stop-color="#0a1c34" />
    </linearGradient>
    <radialGradient id="halo" cx="24%" cy="20%" r="78%">
      <stop offset="0%" stop-color="#86f5ff" stop-opacity="0.6" />
      <stop offset="42%" stop-color="#2f89ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2f89ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7de7ff" />
      <stop offset="100%" stop-color="#7646ff" />
    </linearGradient>
    <linearGradient id="panelBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f95ff" />
      <stop offset="100%" stop-color="#005fcf" />
    </linearGradient>
    <linearGradient id="panelPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7dff" />
      <stop offset="100%" stop-color="#4c57f7" />
    </linearGradient>
    <linearGradient id="panelTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#72e8ff" />
      <stop offset="100%" stop-color="#0c8fc8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#00101f" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />
  <rect width="1200" height="900" fill="url(#halo)" />

  <g opacity="0.14" fill="none" stroke="#d8f6ff" stroke-width="2">
    <path d="M112 170h260M112 198h210M112 226h300" />
    <path d="M852 122c58 10 104 34 138 74" />
    <path d="M820 206c76-18 152-14 224 16" />
    <path d="M790 286c88-28 176-16 248 34" />
  </g>

  <g transform="translate(82 70)">
    <rect x="0" y="0" width="1036" height="760" rx="42" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" />

    <g transform="translate(0 0)">
      <text x="0" y="56" fill="#dff8ff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0.12em">ALL THINGS OPEN 2026</text>
      <text x="0" y="130" fill="#67f0ff" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">AI Systems Fail Silently</text>
      <text x="0" y="184" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">Building Trust Layers with</text>
      <text x="0" y="238" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">Open Source for Reliable AI</text>
      <text x="0" y="304" fill="#cfe4ff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500">October 19-20, 2026</text>
      <text x="0" y="344" fill="#cfe4ff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500">Rishabh Banga</text>
    </g>

    <g transform="translate(0 388)" filter="url(#shadow)">
      <rect x="0" y="0" width="520" height="206" rx="30" fill="rgba(255,255,255,0.08)" stroke="rgba(125,231,255,0.28)" />
      <circle cx="56" cy="103" r="42" fill="rgba(255,255,255,0.12)" />
      <g transform="translate(32 79)" fill="none" stroke="#67f0ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="12" width="36" height="34" rx="6" />
        <path d="M14 0v16M38 0v16M22 12h12" />
        <path d="M20 24h0" />
      </g>
      <text x="120" y="56" fill="#ffffff" font-family="Geist, Inter, Arial, sans-serif" font-size="28" font-weight="700">Trust layer architecture</text>
      <text x="120" y="96" fill="#dbefff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">Real-time scoring across model confidence, retrieval</text>
      <text x="120" y="128" fill="#dbefff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">quality, and contextual signals for safer AI workflows.</text>
      <text x="120" y="168" fill="#7fefff" font-family="Space Mono, monospace" font-size="18" font-weight="700" letter-spacing="0.14em">SPEAKER SESSION</text>
    </g>

    <g transform="translate(644 98)" filter="url(#shadow)">
      <rect x="48" y="0" width="288" height="188" rx="28" fill="url(#panelBlue)" transform="skewX(-12) rotate(10 192 94)" />
      <rect x="32" y="190" width="304" height="192" rx="28" fill="url(#panelPurple)" transform="skewX(-12) rotate(10 184 286)" />
      <rect x="16" y="390" width="320" height="192" rx="28" fill="url(#panelTeal)" transform="skewX(-12) rotate(10 176 486)" />

      <g transform="translate(92 34)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
        <path d="M10 42l24-18 26 18 18-10" />
        <circle cx="10" cy="42" r="7" />
        <circle cx="34" cy="24" r="7" />
        <circle cx="60" cy="42" r="7" />
        <circle cx="78" cy="32" r="7" />
        <path d="M10 72h68" />
      </g>
      <text x="102" y="156" fill="#ffffff" font-family="Geist, Inter, Arial, sans-serif" font-size="42" font-weight="700" transform="skewX(12) rotate(-10 192 94)">MODEL</text>

      <g transform="translate(118 248)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
        <path d="M0 24h18l10-14 12 28 12-20 12 12h18" />
        <rect x="0" y="32" width="12" height="24" rx="2" />
        <rect x="18" y="18" width="12" height="38" rx="2" />
        <rect x="36" y="10" width="12" height="46" rx="2" />
        <path d="M0 70h86" />
      </g>
      <text x="96" y="336" fill="#ffffff" font-family="Geist, Inter, Arial, sans-serif" font-size="38" font-weight="700" transform="skewX(12) rotate(-10 184 286)">EVALUATION</text>

      <g transform="translate(110 452)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
        <circle cx="22" cy="28" r="15" />
        <path d="M8 70c6-20 24-24 28-24s22 4 28 24" />
        <path d="M60 20h28" />
        <path d="M74 6v28" />
      </g>
      <text x="120" y="540" fill="#ffffff" font-family="Geist, Inter, Arial, sans-serif" font-size="36" font-weight="700" transform="skewX(12) rotate(-10 176 486)">HUMAN</text>
      <text x="120" y="584" fill="#ffffff" font-family="Geist, Inter, Arial, sans-serif" font-size="36" font-weight="700" transform="skewX(12) rotate(-10 176 486)">OVERSIGHT</text>
    </g>

    <g transform="translate(0 650)">
      <path d="M0 0h178" stroke="#5bb7ff" stroke-width="4" stroke-linecap="round" />
      <text x="0" y="44" fill="#dbefff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">A practical discussion of what makes AI systems trustworthy in use, not just in theory.</text>
    </g>
  </g>
</svg>
