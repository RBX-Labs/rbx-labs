    <text x="0" y="58" fill="#dff7ff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="0.08em">ALL THINGS OPEN 2026</text>
    <text x="0" y="130" fill="#7fefff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">AI Systems Fail Silently</text>
    <text x="0" y="182" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Building Trust Layers with</text>
    <text x="0" y="234" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Open Source for Reliable AI</text>
    <text x="0" y="300" fill="#cfe8ff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500">October 19-20, 2026</text>
    <text x="0" y="340" fill="#cfe8ff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500">Rishabh Banga</text>
    <rect x="0" y="386" width="470" height="208" rx="28" fill="rgba(255,255,255,0.08)" stroke="rgba(127,239,255,0.28)" />
    <rect x="28" y="416" width="72" height="72" rx="18" fill="url(#panel)" />
    <text x="127" y="453" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Trust layer architecture</text>
    <text x="127" y="494" fill="#d9f7ff" font-family="Inter, Arial, sans-serif" font-size="22">Real-time scoring across confidence, retrieval,</text>
    <text x="127" y="526" fill="#d9f7ff" font-family="Inter, Arial, sans-serif" font-size="22">and contextual signals for safer AI workflows.</text>
    <text x="127" y="568" fill="#8feeff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.12em">SPEAKER SESSION</text>
