<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">FOSSY 2026 session poster</title>
  <desc id="desc">Poster for From Prompts to Runtime Signals: Making Open-Source AI Systems More Trustworthy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041815" />
      <stop offset="52%" stop-color="#0f5a58" />
      <stop offset="100%" stop-color="#081928" />
    </linearGradient>
    <radialGradient id="halo" cx="30%" cy="16%" r="74%">
      <stop offset="0%" stop-color="#8bf7ff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#17b6a3" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#17b6a3" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8bf7ff" />
      <stop offset="100%" stop-color="#17b6a3" />
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ac7ff" />
      <stop offset="100%" stop-color="#1677ff" />
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9f7cff" />
      <stop offset="100%" stop-color="#4c63ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#00110f" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />
  <rect width="1200" height="900" fill="url(#halo)" />

  <g opacity="0.14" fill="none" stroke="#dbfffb" stroke-width="2">
    <path d="M860 126c60 18 100 48 126 94" />
    <path d="M820 192c78 6 132 32 176 84" />
    <path d="M792 256c92-16 164 0 222 48" />
  </g>

  <g transform="translate(82 70)">
    <rect x="0" y="0" width="1036" height="760" rx="42" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" />

    <text x="0" y="56" fill="#e6fffb" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0.12em">FOSSY 2026</text>
    <text x="0" y="130" fill="#89f6ff" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">From Prompts to Runtime Signals:</text>
    <text x="0" y="184" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">Making Open-Source AI Systems</text>
    <text x="0" y="238" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">More Trustworthy</text>
    <text x="0" y="304" fill="#d6fbff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500">Saturday, August 8, 2026</text>
    <text x="0" y="344" fill="#d6fbff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500">Rishabh Banga</text>

    <g transform="translate(0 388)" filter="url(#shadow)">
      <rect x="0" y="0" width="530" height="206" rx="30" fill="rgba(255,255,255,0.08)" stroke="rgba(139,247,255,0.26)" />
      <circle cx="58" cy="103" r="42" fill="rgba(255,255,255,0.12)" />
      <g transform="translate(32 77)" fill="none" stroke="#8bf7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 16h34l-8 18h-18l-8 18h34" />
        <circle cx="18" cy="56" r="5" />
        <circle cx="44" cy="56" r="5" />
        <path d="M18 18v-8M30 18v-8" />
      </g>
      <text x="120" y="56" fill="#ffffff" font-family="Geist, Inter, Arial, sans-serif" font-size="28" font-weight="700">Open-source trust layer</text>
      <text x="120" y="96" fill="#dffcff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">Evaluation, runtime signals, and human oversight</text>
      <text x="120" y="128" fill="#dffcff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">for safer AI systems in production.</text>
      <text x="120" y="168" fill="#8ff8f0" font-family="Space Mono, monospace" font-size="18" font-weight="700" letter-spacing="0.14em">SPEAKER SESSION</text>
    </g>

    <g transform="translate(640 104)" filter="url(#shadow)">
      <rect x="42" y="0" width="306" height="160" rx="28" fill="url(#blue)" transform="skewX(-12) rotate(10 195 80)" />
      <rect x="18" y="176" width="330" height="176" rx="28" fill="url(#purple)" transform="skewX(-12) rotate(10 183 264)" />
      <rect x="0" y="370" width="348" height="176" rx="28" fill="url(#teal)" transform="skewX(-12) rotate(10 174 458)" />

      <g transform="translate(92 26)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
        <path d="M0 66c30-38 58-46 90-28" />
        <circle cx="10" cy="64" r="8" />
        <circle cx="46" cy="42" r="8" />
        <circle cx="78" cy="56" r="8" />
        <path d="M10 64l36-22 32 14" />
      </g>
      <text x="96" y="132" fill="#ffffff" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="700" transform="skewX(12) rotate(-10 195 80)">PROMPTS</text>

      <g transform="translate(92 212)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
        <path d="M0 72l18-18 18 8 18-22 18 14 18-8 18 26" />
        <path d="M4 50h34" />
        <path d="M42 26h34" />
        <path d="M80 42h34" />
        <path d="M118 18h34" />
      </g>
      <text x="84" y="322" fill="#ffffff" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="700" transform="skewX(12) rotate(-10 183 264)">RUNTIME</text>
      <text x="84" y="366" fill="#ffffff" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="700" transform="skewX(12) rotate(-10 183 264)">SIGNALS</text>

      <g transform="translate(110 410)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
        <path d="M0 24c24-18 46-18 68 0" />
        <circle cx="18" cy="28" r="14" />
        <path d="M10 58c4-14 14-22 26-22s22 8 26 22" />
        <path d="M66 18h28" />
        <path d="M80 4v28" />
      </g>
      <text x="92" y="488" fill="#ffffff" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="700" transform="skewX(12) rotate(-10 174 458)">HUMAN</text>
      <text x="92" y="532" fill="#ffffff" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="700" transform="skewX(12) rotate(-10 174 458)">OVERSIGHT</text>
    </g>

    <g transform="translate(0 650)">
      <path d="M0 0h178" stroke="#8bf7ff" stroke-width="4" stroke-linecap="round" />
      <text x="0" y="44" fill="#dffcff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">Evaluation and runtime telemetry for open-source AI that stays observable after launch.</text>
    </g>
  </g>
</svg>
