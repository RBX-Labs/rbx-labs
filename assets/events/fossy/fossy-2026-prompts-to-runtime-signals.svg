    <text x="122" y="456" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Open-source trust layer</text>
    <text x="122" y="498" fill="#dffcff" font-family="Inter, Arial, sans-serif" font-size="22">Evaluation, runtime signals, and human oversight</text>
    <text x="122" y="530" fill="#dffcff" font-family="Inter, Arial, sans-serif" font-size="22">for safer AI systems in production.</text>
    <text x="122" y="572" fill="#8ff7ee" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.12em">SPEAKER SESSION</text>
