<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">FOSSY 2026 session poster</title>
  <desc id="desc">Poster for From Prompts to Runtime Signals: Making Open-Source AI Systems More Trustworthy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041a17" />
      <stop offset="55%" stop-color="#0b4c4d" />
      <stop offset="100%" stop-color="#081928" />
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="16%" r="68%">
      <stop offset="0%" stop-color="#7fefff" stop-opacity="0.55" />
      <stop offset="65%" stop-color="#14b8a6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fefff" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)" />
