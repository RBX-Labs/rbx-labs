    <text x="0" y="58" fill="#dffcff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="0.08em">FOSSY 2026</text>
    <text x="0" y="132" fill="#7fefff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">From Prompts to Runtime Signals:</text>
    <text x="0" y="184" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Making Open-Source AI Systems</text>
    <text x="0" y="236" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">More Trustworthy</text>
    <text x="0" y="300" fill="#cdeff6" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500">Saturday, August 8, 2026</text>
    <text x="0" y="340" fill="#cdeff6" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500">Rishabh Banga</text>
